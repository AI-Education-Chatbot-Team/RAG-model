name: Streamlit CI

# Runs on every pull request into main (and pushes to main) so broken code is
# caught before it is merged. Can also be started by hand from the Actions tab.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # CPU-only torch keeps the install small; GitHub runners have no GPU.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest reportlab python-docx

      - name: Check Python files compile
        run: python -m py_compile ./src/app.py ./src/main.py ./src/ingest.py

      # Tests fake Supabase, Groq, and the ML models, so no secrets are needed
      - name: Run tests
        run: pytest -v

      # The integration tests download the embedding model; keep it between runs
      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2

      # Real MarkItDown parser + embedding model on real PDF/DOCX/TXT/MD/CSV files
      - name: Run integration tests
        run: pytest -v -m integration
